project:
  type: website
  output-dir: ../_site/pt

bibliography: ../references.bib
csl: ../apa.csl

format:
  html:
    theme:
      - cosmo
      - ../synesis.scss
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: true
    highlight-style: github
    syntax-definitions:
      - ../synesis.xml

execute:
  freeze: auto

lang: pt-BR

