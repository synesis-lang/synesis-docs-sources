function val(v){if(v.t==='QUOTATION')return'<blockquote>'+esc(v.v)+'</blockquote><div class="seal '+v.st+'">'+(v.st==='found'?'✓ ':v.st==='not_found'?'✕ ':'? ')+esc(T['q_'+v.st])+'</div>'+ctx(v.ctx);

if(v.t==='CHAIN')return v.v.map(function(c){return'<div class="chain"><span class="chip">'+esc(c[0])+'</span><span class="rel">→ '+esc(c[1])+' →</span><span class="chip">'+esc(c[2])+'</span></div>'}).join('');
if(v.t==='ENUMERATED'||v.t==='ORDERED'||v.t==='TOPIC')return'<span class="chip">'+esc(v.v)+'</span>';return'<div>'+esc(v.v)+'</div>'}
function show(){var it=D.items[cur],j=S.j[it.id]||{},c=d.getElementById('card'),on=!!S.rater;
var h='<div class="meta"><b>'+esc(T.annotation)+' '+(cur+1)+'/'+D.items.length+'</b><span>'+esc(T.source)+': @'+esc(it.src)+'</span>'+(it.g?'<span>'+esc(T.group)+': '+esc(it.g)+'</span>':'')
+'<a href="'+esc(vs(it.f,it.l))+'">'+esc(T.open_vs)+' ('+esc(it.f)+':'+it.l+')</a></div>';
if(it.changed)h+='<p class="warn">'+esc(T.item_changed)+'</p>';
h+=(it.vals||[]).map(function(v){return'<div class="fld"><div class="fn">'+esc(v.n)+'</div>'+val(v)+'</div>'}).join('');
if(!on)h+='<p class="warn">'+esc(T.need_rater)+'</p>';
h+='<div class="verdict">'+[['approved',T.approve,1],['rejected',T.reject,2],['doubt',T.doubt,3]].map(function(b){return'<button type="button" class="'+b[0]+(j.verdict===b[0]?' on':'')+'" data-v="'+b[0]+'"'+(on?'':' disabled')+'>'+esc(b[1])+'<kbd>'+b[2]+'</kbd></button>'}).join('')+'</div>';
h+='<div class="why'+(j.verdict&&j.verdict!=='approved'?' on':'')+'"><label for="rs">'+esc(T.reason)+'</label><select id="rs"><option value=""></option>'+D.reasons.map(function(r){return'<option value="'+r+'"'+(j.reason===r?' selected':'')+'>'+esc(T.reasons[r])+'</option>'}).join('')+'</select></div>';
h+='<textarea id="nt" placeholder="'+esc(T.note)+'"'+(on?'':' disabled')+'>'+esc(j.note||'')+'</textarea>';
h+='<details class="fix"'+(j.proposal?' open':'')+'><summary>'+esc(T.propose)+'</summary><p class="muted small">'+esc(T.propose_hint)+'</p><textarea id="pp" class="code" spellcheck="false"'+(on?'':' disabled')+'>'+esc(j.proposal||it.block)+'</textarea></details>';
if(D.likert.length)h+='<details class="lk"'+(j.likert&&Object.keys(j.likert).length?' open':'')+'><summary>'+esc(T.detail)+'</summary>'+D.likert.filter(function(n){return(it.vals||[]).some(function(v){return v.n===n})}).map(function(n){return'<div class="lkq" role="radiogroup" aria-label="'+esc(f(T.likert_q,{f:n}))+'"><div>'+esc(f(T.likert_q,{f:n}))+'</div><div class="opts">'+T.likert.map(function(l,k){var ck=j.likert&&j.likert[n]===k+1;return'<label><input type="radio" name="lk-'+esc(n)+'" value="'+(k+1)+'" data-n="'+esc(n)+'"'+(ck?' checked':'')+(on?'':' disabled')+'>'+(k+1)+' · '+esc(l)+'</label>'}).join('')+'</div></div>'}).join('')+'</details>';
h+='<div class="nav"><button class="btn" type="button" id="pv">← '+esc(T.prev)+'</button><button class="btn" type="button" id="no">'+esc(T.next_open)+'</button><button class="btn" type="button" id="nx">'+esc(T.next)+' →</button></div>';
c.innerHTML=h;
c.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){verdict(b.dataset.v)}});
d.getElementById('rs').onchange=function(e){upd({reason:e.target.value})};d.getElementById('nt').onchange=function(e){upd({note:e.target.value})};
d.getElementById('pp').onchange=function(e){var v=e.target.value.replace(/\s+$/,'');upd({proposal:v===it.block.replace(/\s+$/,'')?'':v})};
c.querySelectorAll('input[type=radio]').forEach(function(r){r.onchange=function(){var o=Object.assign({},(S.j[it.id]||{}).likert||{});o[r.dataset.n]=+r.value;upd({likert:o})}});
d.getElementById('pv').onclick=function(){go(-1)};d.getElementById('nx').onclick=function(){go(1)};d.getElementById('no').onclick=nextOpen;list();stats()}
function upd(p){var it=D.items[cur];if(!S.rater)return;S.j[it.id]=Object.assign({item:it.id,verdict:null,likert:{},reason:'',note:'',proposal:''},S.j[it.id]||{},p);save()}
function verdict(v){if(!S.rater)return;upd({verdict:v});show();if(v==='approved')setTimeout(function(){nextOpen()},150)}
function go(k){cur=Math.max(0,Math.min(D.items.length-1,cur+k));show()}
function nextOpen(){for(var k=1;k<=D.items.length;k++){var i=(cur+k)%D.items.length;var j=S.j[D.items[i].id];if(!(j&&j.verdict)){cur=i;show();return}}show()}
function wil(x,n){var z=1.96;if(!n)return[0,1];var p=x/n,dn=1+z*z/n,c=(p+z*z/(2*n))/dn,hw=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/dn;return[Math.max(0,c-hw),Math.min(1,c+hw)]}
function pc(x){return(Math.round(x*1000)/10).toLocaleString(d.documentElement.lang||undefined)}
function judged(){return D.items.map(function(it){return S.j[it.id]}).filter(function(j){return j&&j.verdict})}
function stats(){var js=judged(),a=0,r=0,o=0;js.forEach(function(j){if(j.verdict==='approved')a++;else if(j.verdict==='rejected')r++;else o++});
var k=js.length,n=D.items.length;d.getElementById('pb').style.width=(100*k/n)+'%';d.getElementById('pg').textContent=(S.rater?S.rater+' · ':'')+f(T.progress,{k:k,n:n})+(S.dirty?' · '+T.unsaved:'');
var h='<p><b>'+esc(f(T.stats,{a:a,r:r,d:o}))+'</b></p>',dec=a+r;
if(dec){if(r){var w=wil(r,dec);h+='<p>'+esc(f(T.rate,{p:pc(r/dec),r:r,n:dec,lo:pc(w[0]),hi:pc(w[1])}))+'</p>'}else h+='<p>'+esc(f(T.rule3,{n:dec,u:pc(Math.min(1,3/dec))}))+'</p>';h+='<p class="muted small">'+esc(T.rate_note)+'</p>'}
var first=D.items.slice(0,D.stop[0]).map(function(it){return S.j[it.id]}),fj=first.filter(function(j){return j&&j.verdict}),fr=fj.filter(function(j){return j.verdict==='rejected'}).length;
if(fj.length>=Math.min(D.stop[0],n)&&fr>=Math.ceil(D.stop[1]*fj.length))h+='<p class="warn">'+esc(f(T.stop,{k:fj.length,r:fr}))+'</p>';
d.getElementById('st').innerHTML=h}
/* export: one Markdown file for the coordinator, readable by people and by an AI, with the data for --import */
function fence(s){return'```synesis\n'+s+'\n```'}
d.getElementById('exp').onclick=function(){if(!S.rater){alert(T.need_rater);return}var js=judged(),today=new Date().toISOString().slice(0,10);
var data={kind:'synesis-skill/review',sample:D.sample,project:D.project,state:D.state,rater:S.rater,exported_on:today,judgments:js};
var a=0,r=0,o=0;js.forEach(function(j){if(j.verdict==='approved')a++;else if(j.verdict==='rejected')r++;else o++});
var md=['# Synesis review — '+D.project+' — '+S.rater,'','> '+f(T.md_human,{rater:S.rater}),'',
'Project: '+D.project+' · sample: '+D.sample+' ('+D.items.length+' of '+D.population+' annotations) · rater: '+S.rater+' · exported: '+today,'',
'## Instructions for the AI that reads this file','',D.ai,'',
'## Summary','','Judged '+js.length+' of '+D.items.length+': approved '+a+', rejected '+r+', doubt '+o+'. Proposed corrections: '+js.filter(function(j){return j.proposal}).length+'.','',
'## Annotations','',''];
D.items.forEach(function(it,i){var j=S.j[it.id];if(!(j&&j.verdict))return;
md.push('### '+(i+1)+'. '+it.id+' — @'+it.src+(it.g?' ('+it.g+')':'')+' — '+it.f+':'+it.l+' — '+j.verdict.toUpperCase(),'');
if(j.reason)md.push('Reason: '+j.reason);if(j.note)md.push('Note: '+j.note.replace(/\n/g,' '));
if(j.likert&&Object.keys(j.likert).length)md.push('Scale 1-5: '+Object.keys(j.likert).map(function(k){return k+'='+j.likert[k]}).join(', '));
md.push('','Block as reviewed:','',fence(it.block),'');if(j.proposal)md.push('Proposed correction:','',fence(j.proposal),'')});
md.push('## Data for the import (do not edit)','','<!-- synesis-review-data -->','```json',JSON.stringify(data,null,1),'```','');
var name=D.project+'-review-'+D.sample+'-'+S.rater.replace(/[^A-Za-z0-9_.-]+/g,'_')+'.md';
var blob=new Blob([md.join('\n')],{type:'text/markdown'});var el=d.createElement('a');el.href=URL.createObjectURL(blob);el.download=name;d.body.appendChild(el);el.click();el.remove();
S.dirty=false;try{localStorage.setItem(rkey(S.rater),JSON.stringify(S))}catch(e){}stats();alert(f(T.exported,{file:name}))};
d.getElementById('imp').onchange=function(e){var fl=e.target.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){try{var tx=String(rd.result),x;
if(/^\s*\{/.test(tx))x=JSON.parse(tx);else{var i=tx.indexOf('<!-- synesis-review-data -->'),m=i<0?null:/```json\s*\n([\s\S]*?)\n```/.exec(tx.slice(i));if(!m)throw new Error('no review data');x=JSON.parse(m[1])}
if(x.sample!==D.sample)throw new Error(D.sample);S=load(x.rater||S.rater||'rater');S.rater=x.rater||S.rater;(x.judgments||[]).forEach(function(j){S.j[j.item]=j});rt.value=S.rater;save();show()}catch(err){alert(err)}};rd.readAsText(fl);e.target.value=''};
d.getElementById('th').onclick=function(){var c2=d.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),nx=c2==='dark'?'light':'dark';d.documentElement.dataset.theme=nx;try{localStorage.setItem('synesis-theme',nx)}catch(e){}};
d.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='1')verdict('approved');else if(e.key==='2')verdict('rejected');else if(e.key==='3')verdict('doubt');else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)});
var firstOpen=D.items.findIndex(function(it){var j=S.j[it.id];return!(j&&j.verdict)});cur=firstOpen<0?0:firstOpen;show();
</script></body></html>
