 const inp = el("input",{type:"text",placeholder:T.note,value:m.note||""}); inp.addEventListener("change",()=>setMark(kind,target,{note:inp.value}));
 return el("div",{class:"marks"}, btn("correct","✓ "+T.correct), btn("wrong","✗ "+T.wrong), btn("doubt","? "+T.doubt), el("br"), inp); }

function banners(){ const b = document.getElementById("banners"); b.replaceChildren();
 const v = D.validation, an = D.anchoring.summary;
 const ready = v.ready && D.anchoring.verified && !D.stale.length;
 b.append(el("div",{class:"banner "+(ready?"ok":"bad")}, ready?T.ready:T.notready, " — ",
   `${v.errors} ${T.errors}, ${v.warnings} ${T.warnings}; ${T.anch}: ${an.found} ${T.found}, ${an.not_found} ${T.not_found}, ${an.unverifiable} ${T.unverifiable}`));
 if(D.stale.length) b.append(el("div",{class:"banner warn"}, T.stale+": ", D.stale.map(s=>s.what+" ("+s.why+")").join("; ")));
 if(dirty) b.append(el("div",{class:"banner warn"}, Object.keys(marks).length+" "+T.unsaved)); }

const views = {
 sources(){ const out=[]; const q = el("input",{type:"search",placeholder:T.search});
  const box = el("div"); const tools = el("div",{class:"tools"}, q,
    el("button",{onclick:exportMarks},T.exportm),
    el("label",{}, T.importm, el("input",{type:"file",accept:".json",style:"display:none",onchange:e=>importMarks(e.target.files[0])})));
  const bib = A.bibliography || {};
  function draw(){ box.replaceChildren(); const term=(q.value||"").toLowerCase();
   const bySrc = {}; for(const it of (A.corpus||[])) (bySrc[it.source_ref]=bySrc[it.source_ref]||[]).push(it);
   for(const ref of Object.keys(bySrc).sort()){ const key=ref.replace(/^@/,""); const e=bib[key]||{};
    const items = bySrc[ref].filter(it => !term || JSON.stringify(it.data).toLowerCase().includes(term)); if(!items.length) continue;
    const card = el("div",{class:"card"}, el("h3",{}, ref+" — "+(e.title||"")), el("div",{class:"kv"}, e.description||""));
    for(const it of items){ const d = it.data||{};
     card.append(el("div",{class:"kv"}, it.id+" · "+(it.traceability.file||"")+":"+(it.traceability.line||"")));
     for(const r of (anchorBy[it.id]||[])) card.append(el("div",{class:"q"}, r.excerpt, " ", el("span",{class:"st-"+r.status}, "["+T[r.status]+"]")));
     for(const f of MF) for(const v of asList(d[f])) card.append(el("div",{}, el("b",{}, f+": "), v));
     const chips = el("div"); for(const f of CF) for(const c of asList(d[f])) chips.append(el("span",{class:"chip"}, c)); card.append(chips);
     for(const f of HF) for(const t of asList(d[f])) card.append(el("div",{class:"kv"}, (t.from||"")+" → "+(t.relation||"")+" → "+(t.to||"")));
     card.append(markBox("item", it.id)); }
    box.append(card); } }
  q.addEventListener("input", draw); draw(); return [tools, box]; },
 codes(){ const onto = A.ontology || {}; const ev = {};
  for(const it of (A.corpus||[])) for(const f of CF) for(const c of asList((it.data||{})[f])) (ev[c]=ev[c]||[]).push(it);
  const names = [...new Set([...Object.keys(ev), ...Object.keys(onto)])].sort();
  return names.map(n => { const o = onto[n]; const items = ev[n]||[];
   return el("div",{class:"card"}, el("h3",{}, n+" ("+items.length+" "+T.evidence+")"),
    el("div",{class: o?"":"sev-warning"}, o ? (o.description || "") : T.nodef),
    items.map(it => el("div",{class:"q"}, asList((it.data||{})[QF[0]])[0] || it.id, " — ", it.id)),
    markBox("code", n)); }); },
 relations(){ const rows = [];
  for(const it of (A.corpus||[])) for(const f of HF) for(const t of asList((it.data||{})[f])) rows.push([t.from,t.relation,t.to,it.source_ref,it.id]);
  rows.sort((a,b)=>String(a).localeCompare(String(b)));
  if(!rows.length) return [el("p",{},T.none)];
  return [el("table",{}, el("tr",{}, ["from","relation","to","source","item"].map(h=>el("th",{},h))), rows.map(r=>el("tr",{}, r.map(c=>el("td",{},c||"")))))]; },
 questions(){ const qs = (A.project && A.project.questions) || [];
  if(!qs.length) return [el("p",{},T.noq)];
  return qs.map(q => el("div",{class:"card"}, el("h3",{}, (q.id||q.key||"")+": "+(q.text||q.question||JSON.stringify(q))))); },
 quality(){ const out=[];
  out.push(el("div",{class:"card"}, el("h3",{},T.diag+` (${D.validation.errors} ${T.errors}, ${D.validation.warnings} ${T.warnings})`),
   D.validation.diagnostics.length ? D.validation.diagnostics.map(d=>el("pre",{class:"sev-"+d.severity}, `${d.file}:${d.line}:${d.column} [${d.severity}] ${d.code}\n${d.message}`)) : el("p",{},T.none)));
  const bad = (D.anchoring.results||[]).filter(r=>r.status!=="found");
  out.push(el("div",{class:"card"}, el("h3",{},T.anch+" — "+(D.anchoring.mode==="literal"?T.literal:T.normalized)),
   el("div",{class:"kv"}, (D.anchoring.normalization||[]).join(" · ")),
   bad.length ? bad.map(r=>el("div",{class:"q"}, el("span",{class:"st-"+r.status},"["+T[r.status]+"] "), r.item+" ["+r.field+"] ", r.excerpt, r.reason?(" — "+r.reason):"")) : el("p",{},T.none)));
  const tc = D.template_check || {missing:[]};
  out.push(el("div",{class:"card"}, el("h3",{},T.template), tc.missing.length ? tc.missing.map(m=>el("div",{class:"sev-error"}, T.noguide+": "+m.field+" ("+m.type+", "+m.scope+")")) : el("p",{},"GUIDELINES: "+tc.fields+"/"+tc.fields)));
  if((D.continuation_lines||[]).length) out.push(el("div",{class:"card"}, el("h3",{class:"sev-error"},T.mline), D.continuation_lines.map(c=>el("div",{}, c.file+":"+c.line+"  "+c.text))));
  if(D.stale.length) out.push(el("div",{class:"card"}, el("h3",{},T.stale), D.stale.map(s=>el("div",{}, s.what+" — "+s.why))));
  return out; },
 method(){ const out=[];
  out.push(el("div",{class:"card"}, el("h3",{},T.template), Object.keys(specs).sort().map(n => { const s=specs[n];
   return el("div",{}, el("b",{}, n), ` (${s.type}, ${s.scope}) — ${s.description||""}`, s.guidelines?el("pre",{}, s.guidelines):el("div",{class:"sev-error"},T.noguide)); })));
  out.push(el("div",{class:"card"}, el("h3",{},T.runs), (D.runs||[]).length ? D.runs.map(r=>el("div",{}, `${r.id} — ${r.status} — ${T.backend}: ${r.backend} — ${T.model}: ${r.model||"?"} — synesis ${(r.versions||{})["synesis"]||"?"}, synesis-coder ${(r.versions||{})["synesis-coder"]||"?"}`)) : el("p",{},T.none)));
  out.push(el("div",{class:"card"}, el("h3",{},T.decisions), (D.decisions||[]).length ? D.decisions.map(d=>el("div",{}, `${d.date} — ${d.type}${d.triage_class?" ("+d.triage_class+")":""} — ${d.note||""}`)) : el("p",{},T.none)));
  return out; }
};
let current = "sources";
function show(name){ current = name; for(const b of document.querySelectorAll("nav button")) b.classList.toggle("on", b.dataset.v===name);
 document.getElementById("view").replaceChildren(...[].concat(views[name]())); }
document.getElementById("title").textContent = D.project.name;
document.getElementById("state").textContent = "state " + D.project.state.slice(0,12);
const nav = document.getElementById("tabs");
for(const v of Object.keys(views)){ const b = el("button",{onclick:()=>show(v)}, T[v]); b.dataset.v=v; nav.append(b); }
banners(); show("sources");
</script>
</body>
</html>
